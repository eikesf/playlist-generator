name: Main source branch

# main only takes releases from develop and emergency fixes from hotfix/*.
# The "source-branch" check is required on main by the repository ruleset.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR comes from develop or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::PRs into main must come from a branch in this repository, not a fork."
            exit 1
          fi
          case "$HEAD_REF" in
            develop|hotfix/*)
              echo "OK: '$HEAD_REF' may be merged into main."
              ;;
            *)
              echo "::error::'$HEAD_REF' cannot be merged into main. Open the PR into develop, or use a hotfix/* branch for an emergency fix."
              exit 1
              ;;
          esac
