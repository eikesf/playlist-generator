name: Release please

# Guide §11: semantic versioning from Conventional Commits.
# The release PR targets develop (the default branch): every push to develop updates it with the next
# version and CHANGELOG. Merging it into develop tags vX.Y.Z and creates the GitHub release; the next
# develop -> main release carries that version to main. No back-merge from main is needed.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# A PR opened by GitHub Actions does not start CI by itself: close and reopen it once to run the checks.
on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
